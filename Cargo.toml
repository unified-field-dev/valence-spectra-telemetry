[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"


[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
spectra = { package = "uf-spectra", version = "0.1.3", default-features = false }
spectra-core = { package = "uf-spectra-core", version = "0.1.3" }
spectra-macros = { version = "0.1.3" }
valence-telemetry = { package = "uf-valence-telemetry", version = "0.1.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
futures = "0.3"
tokio = { version = "1.45.0", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "valence-spectra-telemetry"
description = "Valence Spectra telemetry schemas, Photon topics, and TelemetrySink install"
repository = "https://github.com/unified-field-dev/valence-spectra-telemetry"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
valence-telemetry = { workspace = true }
spectra = { workspace = true }
spectra-core = { workspace = true }
spectra-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }


[[example]]
name = "telemetry_sink_smoke"
